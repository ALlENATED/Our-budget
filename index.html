<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Budget</title>
<link rel="stylesheet" href="style.css">

<!--
  Firebase SDKs (CDN / Script Tag method).
  Modules used by the app:
    - firebase-app.js     : initializes the Firebase app
    - firebase-auth.js    : email + password sign-in
    - firebase-firestore.js : the database
  All type="module" so they can be imported inside our own app.js module.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
           setDoc, getDoc, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /*
   * Firebase config — the exact values from your Firebase project.
   * These identify which Firebase project the app talks to.
   */
  const firebaseConfig = {
    apiKey: "AIzaSyCvfnT1Ae5z9MamxnhcPJtDcQMlUoB9xdk",
    authDomain: "our-budget-4c4d7.firebaseapp.com",
    projectId: "our-budget-4c4d7",
    storageBucket: "our-budget-4c4d7.firebasestorage.app",
    messagingSenderId: "558436370018",
    appId: "1:558436370018:web:3919e6be359c6c291c333b",
    measurementId: "G-Z0MQHV7YFM"
  };

  // Initialize Firebase once and expose for app.js
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Expose Firebase services on window so app.js (loaded next as a module)
  // can use them without re-importing everything.
  window.FB = { app, auth, db,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged,
    collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
    setDoc, getDoc, query, orderBy, serverTimestamp };

  // Load the main app module AFTER Firebase is ready
  import('./app.js');
</script>
</head>
<body>

<!--
  #app contains every visible part of the UI.
  Screens are shown/hidden by toggling the .active class, so switching
  tabs never reloads the page.
-->
<div id="app">

  <!-- Loading overlay — faded out by app.js when Firebase + login state are ready -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading…</div>
  </div>

  <!-- Login screen — shown only when the user is not signed in -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-logo">💰</div>
      <h1 class="login-title">Our Budget</h1>
      <p class="login-sub">A shared budget for us.</p>

      <input id="login-email" type="email" class="login-input" placeholder="Email" autocomplete="email">
      <input id="login-password" type="password" class="login-input" placeholder="Password" autocomplete="current-password">

      <button id="login-btn" class="login-primary">Sign in</button>
      <button id="signup-btn" class="login-secondary">Create account</button>

      <p class="login-hint" id="login-error" style="color:var(--red);display:none"></p>
    </div>
  </div>

  <!-- Screens — every screen is a div. Only one is visible at a time. -->
  <div id="screens"></div>

  <!-- Tab bar — 6 tabs, populated by app.js -->
  <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>

  <!-- Toast — small floating notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Sheet root — modal sheets (edit forms, pickers) are injected here -->
  <div id="sheet-root"></div>

</div>

</body>
</html>
