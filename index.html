<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Budget</title>
<link rel="stylesheet" href="style.css">

<!--
  Firebase SDKs (CDN / Script Tag method).
  All four modules we need:
    - firebase-app.js    : initializes the Firebase app
    - firebase-auth.js   : Google Sign-In
    - firebase-firestore.js : the database
  All type="module" so they can be imported inside our own app.js module.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
           setDoc, getDoc, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /*
   * Firebase config — the exact values from your Firebase project.
   * These identify which Firebase project the app talks to.
   */
  const firebaseConfig = {
    apiKey: "AIzaSyCvfnT1Ae5z9MamxnhcPJtDcQMlUoB9xdk",
    authDomain: "our-budget-4c4d7.firebaseapp.com",
    projectId: "our-budget-4c4d7",
    storageBucket: "our-budget-4c4d7.firebasestorage.app",
    messagingSenderId: "558436370018",
    appId: "1:558436370018:web:3919e6be359c6c291c333b",
    measurementId: "G-Z0MQHV7YFM"
  };

  // Initialize Firebase once and expose for app.js
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Expose Firebase services on window so app.js (loaded next as a module)
  // can use them without re-importing everything.
  window.FB = { app, auth, db,
    GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
    collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
    setDoc, getDoc, query, orderBy, serverTimestamp };

  // Load the main app module AFTER Firebase is ready
  import('./app.js');
</script>
</head>
<body>

<!--
  #app contains every visible part of the UI.
  Screens are shown/hidden by toggling the .active class, so switching
  tabs never reloads the page.
-->
<div id="app">

  <!-- Loading overlay — faded out by app.js when Firebase + login state are ready -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading…</div>
  </div>

  <!-- Login screen — shown only when the user is not signed in -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-logo">💰</div>
      <h1 class="login-title">Our Budget</h1>
      <p class="login-sub">A shared budget for two.</p>
      <button id="google-signin" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:8px;vertical-align:middle">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.63z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.16.27-1.7V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.34l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.96l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
      <p class="login-hint">You and your partner both sign in here.<br>Same budget, same data.</p>
    </div>
  </div>

  <!-- Screens — every screen is a div. Only one is visible at a time. -->
  <div id="screens"></div>

  <!-- Tab bar — 6 tabs, populated by app.js -->
  <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>

  <!-- Toast — small floating notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Sheet root — modal sheets (edit forms, pickers) are injected here -->
  <div id="sheet-root"></div>

</div>

</body>
</html>
